name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Structural self-validation
        run: python3 scripts/validate.py
      - name: Validator regressions
        run: python3 scripts/test_validate.py
      - name: Privacy scan
        run: python3 scripts/privacy_scan.py
      - name: Markdown lint
        run: python3 scripts/md_lint.py
